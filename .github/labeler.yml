# Version-affecting labels are derived only from the head branch. Paths never
# introduce a SemVer impact label, so release validation remains unambiguous.
'BREAKING CHANGE':
  - head-branch: ['^breaking-change/(?:feat|perf|fix)/']

DEPRECATED:
  - head-branch: ['^deprecated/(?:feat|perf|fix)/']

feat:
  - head-branch: ['^(?:(?:breaking-change|deprecated)/)?feat/']

perf:
  - head-branch: ['^(?:(?:breaking-change|deprecated)/)?perf/']

fix:
  - head-branch: ['^(?:(?:breaking-change|deprecated)/)?fix/']

revert:
  - head-branch: ['^(?:revert|rollback/v[0-9]+\.[0-9]+\.[0-9]+)/']

release:
  - head-branch: ['^(?:release|rollback)/v[0-9]+\.[0-9]+\.[0-9]+/']

# These labels do not affect the version. A path matcher means "only files in
# this set"; a code PR with an incidental docs or test change is not relabeled.
docs:
  - any:
      - head-branch: ['^docs/']
      - changed-files:
          - any-glob-to-all-files: ['{docs/**,**/*.md,**/*.mdx}']

refactor:
  - head-branch: ['^refactor/']

style:
  - head-branch: ['^style/']

test:
  - any:
      - head-branch: ['^test/']
      - changed-files:
          - any-glob-to-all-files: ['{test,tests}/**']

build:
  - any:
      - head-branch: ['^build/']
      - changed-files:
          - any-glob-to-all-files:
              ['{package.json,pnpm-lock.yaml,pnpm-workspace.yaml,astro.config.*,wrangler.*}']

ci:
  - any:
      - head-branch: ['^ci/']
      - changed-files:
          - any-glob-to-all-files: ['{.github/workflows/**,.github/scripts/**}']

chore:
  - head-branch: ['^(?:chore|release/v[0-9]+\.[0-9]+\.[0-9]+)/']
