apiVersion: gh-infra/v1
kind: Repository
metadata:
  name: blog
  owner: daiksudme

# Additive reconciliation updates this vocabulary without removing GitHub's
# default or Dependabot-managed labels and rulesets.
reconcile:
  labels: additive
  rulesets: additive

spec:
  description: Specifications for blog.daiksud.me
  topics: [adr, astro, blog, cloudflare-workers, gherkin, specification]
  visibility: public
  archived: false

  labels:
    - name: BREAKING CHANGE
      description: Backward-incompatible behavior (MAJOR; MINOR before 1.0.0)
      color: b60205
    - name: DEPRECATED
      description: Behavior marked for future removal (MINOR)
      color: fbca04
    - name: feat
      description: New user-visible behavior (MINOR)
      color: 0e8a16
    - name: perf
      description: User-visible performance improvement (MINOR)
      color: 7fd18a
    - name: fix
      description: Bug fix (PATCH)
      color: 0052cc
    - name: revert
      description: Reverts previously released behavior (PATCH)
      color: 79b8ff
    - name: docs
      description: Documentation-only change
      color: c4b5e0
    - name: refactor
      description: Internal code change without behavior change
      color: 8ec9cc
    - name: style
      description: Non-functional style change
      color: b5dcde
    - name: test
      description: Test-only change
      color: d8ecec
    - name: build
      description: Build system or dependency change
      color: a8aeb4
    - name: ci
      description: CI configuration or script change
      color: cfd3d7
    - name: chore
      description: Other maintenance change
      color: ededed

  features:
    issues: true
    projects: true
    wiki: false
    discussions: false
    pull_requests: true

  merge_strategy:
    allow_merge_commit: false
    allow_squash_merge: true
    allow_rebase_merge: false
    allow_auto_merge: true
    auto_delete_head_branches: true
    squash_merge_commit_title: PR_TITLE
    squash_merge_commit_message: COMMIT_MESSAGES

  release_immutability: true

  security:
    vulnerability_alerts: true
    automated_security_fixes: true
    private_vulnerability_reporting: true

  rulesets:
    - name: main
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include: [~DEFAULT_BRANCH]
      rules:
        pull_request:
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: true
        required_status_checks:
          strict_required_status_checks_policy: true
          contexts:
            - context: CI success
              app: github-actions
            - context: Policy success
              app: github-actions
        non_fast_forward: true
        deletion: true
        creation: false
        required_linear_history: false
        required_signatures: true
    - name: immutable-version-tags
      target: tag
      enforcement: active
      conditions:
        ref_name:
          include: ['refs/tags/v*']
      rules:
        non_fast_forward: true
        deletion: true
        creation: false
        required_linear_history: false
        required_signatures: false

  actions:
    enabled: true
    allowed_actions: all
    sha_pinning_required: true
    workflow_permissions: read
    can_approve_pull_requests: false
    fork_pr_approval: first_time_contributors
